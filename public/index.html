<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ToDoリスト</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E85424">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ToDo">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- Drawer overlay -->
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- Left drawer -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-header">
      <span class="drawer-title">メニュー</span>
      <button class="btn-icon" id="btn-close-drawer" aria-label="閉じる">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="drawer-lists-section" id="drawer-lists-section">
      <div class="drawer-section-header">
        <span class="drawer-section-title">リスト</span>
        <button class="drawer-edit-btn" id="btn-drawer-edit">編集</button>
      </div>
      <div id="drawer-lists-container"></div>
    </div>
    <div class="drawer-footer">
      <button class="btn-add-list" id="btn-drawer-add">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        リストを追加
      </button>
      <button class="btn-add-list" id="btn-drawer-export">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 1v9M4.5 6.5L8 10l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        データをエクスポート
      </button>
    </div>
  </aside>

  <!-- ===== Detail view (full-screen, slides in from right) ===== -->
  <div class="detail-view" id="detail-view">
    <header class="detail-header">
      <button class="btn-back" id="btn-back" aria-label="戻る">
        <svg width="10" height="17" viewBox="0 0 10 17" fill="none">
          <path d="M9 1.5L1.5 8.5L9 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="detail-title" id="detail-title"></span>
      <div class="detail-header-right">
        <button class="detail-action-btn" id="btn-detail-edit">
          <svg width="14" height="12" viewBox="0 0 14 12" fill="none">
            <path d="M1 1h12M1 6h8M1 11h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          編集
        </button>
        <div class="detail-more-wrap">
          <button class="detail-action-btn" id="btn-detail-more">
            <svg width="16" height="4" viewBox="0 0 16 4" fill="none">
              <circle cx="2" cy="2" r="1.5" fill="currentColor"/>
              <circle cx="8" cy="2" r="1.5" fill="currentColor"/>
              <circle cx="14" cy="2" r="1.5" fill="currentColor"/>
            </svg>
            その他
          </button>
          <div class="detail-more-menu" id="detail-more-menu">
            <button class="detail-more-item detail-more-delete" id="btn-detail-more-delete">タスクを削除</button>
            <button class="detail-more-item" id="btn-detail-rename">タスク名を編集</button>
          </div>
        </div>
      </div>
    </header>

    <div class="detail-content" id="detail-content"></div>

    <div class="detail-add-row" id="detail-add-row">
      <input type="text" id="detail-subtask-input" placeholder="追加… 例: 1-30 または 1.5.10" maxlength="200" autocomplete="off">
    </div>

    <button class="btn-detail-trash" id="btn-detail-trash" aria-label="タスクを削除">
      <svg width="19" height="21" viewBox="0 0 19 21" fill="none">
        <path d="M1 5h17M6 5V3h7v2M2.5 5l1.3 13h11.4L16.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button class="fab detail-fab" id="btn-detail-add" aria-label="サブタスクを追加">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M11 3v16M3 11h16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="app">
    <div class="app-sticky-top">
      <header class="app-header">
        <button class="btn-icon btn-menu" id="btn-menu" aria-label="メニューを開く">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="header-right">
          <button class="btn-icon" id="btn-search-toggle" aria-label="検索">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.8"/>
              <path d="M13 13l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="btn-icon" id="btn-qr" aria-label="QRコード">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <rect x="2" y="2" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.7"/>
              <rect x="11" y="2" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.7"/>
              <rect x="2" y="11" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.7"/>
              <rect x="3.5" y="3.5" width="4" height="4" rx="0.5" fill="currentColor"/>
              <rect x="12.5" y="3.5" width="4" height="4" rx="0.5" fill="currentColor"/>
              <rect x="3.5" y="12.5" width="4" height="4" rx="0.5" fill="currentColor"/>
              <path d="M11 11h2v2h-2zM13 13h2v2h-2zM15 11h2v2h-2zM11 15h2v2h-2zM15 15h2v2h-2z" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="search-bar" id="search-bar">
        <input type="search" id="search-input" placeholder="タスクを検索..." autocomplete="off">
      </div>

      <div class="tabs-wrapper">
        <div class="filter-tabs" role="tablist"></div>
        <div class="tabs-actions">
          <button class="tab-ctrl-btn" id="btn-quick-add-toggle">＋ タスク</button>
        </div>
      </div>

      <div class="quick-add" id="quick-add-bar">
        <input type="text" id="quick-add-input" placeholder="タスク名を入力して Enter" maxlength="200" autocomplete="off">
      </div>

      <div class="task-sort-bar" id="task-sort-bar">
        <button class="sort-btn active" data-sort="default">更新順</button>
        <button class="sort-btn" data-sort="alpha">あいうえお順</button>
      </div>
    </div>

    <main class="todo-list" id="todo-list" role="list"></main>
  </div>

  <!-- FAB (main list) -->
  <button class="fab" id="btn-open-modal" aria-label="タスクを追加">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <path d="M11 3v16M3 11h16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- モーダル背景（バックドロップのみ） -->
  <div class="modal-backdrop" id="modal-overlay"></div>

  <!-- モーダル本体（常にDOM存在・transformで隠す） -->
  <div class="modal-container" id="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 id="modal-title">新しいタスク</h2>
        <button class="btn-close" id="btn-close-modal" aria-label="閉じる">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <form id="task-form" novalidate>
        <div class="form-group">
          <label for="task-title">タスク名 <span class="required">*</span></label>
          <input type="text" id="task-title" placeholder="何をしますか？" maxlength="200" autocomplete="off" required>
          <span class="field-error" id="title-error">タスク名を入力してください</span>
        </div>
        <button type="submit" class="btn-submit" id="btn-submit">追加する</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <!-- QR モーダル -->
  <div class="qr-overlay" id="qr-overlay">
    <div class="qr-modal">
      <div class="qr-header">
        <span class="qr-title">QRコード</span>
        <button class="btn-icon" id="btn-close-qr" aria-label="閉じる">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="qr-canvas-wrap" id="qr-canvas"></div>
      <p class="qr-url" id="qr-url"></p>
      <p class="qr-hint">iPhoneのカメラで読み取ってください</p>
    </div>
  </div>

  <!-- List name sheet -->
  <div class="sheet-overlay" id="list-sheet-overlay"></div>
  <div class="list-name-sheet" id="list-name-sheet">
    <div class="list-sheet-handle"></div>
    <p class="list-sheet-title">新しいリスト</p>
    <div class="list-sheet-input-row">
      <input type="text" id="list-name-input" placeholder="リスト名を入力" maxlength="50" autocomplete="off">
    </div>
    <div class="list-sheet-actions">
      <button class="list-sheet-cancel" id="btn-list-sheet-cancel">キャンセル</button>
      <button class="list-sheet-submit" id="btn-list-sheet-submit">追加</button>
    </div>
  </div>

  <!-- Subtask edit sheet -->
  <div class="sheet-overlay" id="sheet-overlay"></div>
  <div class="subtask-sheet" id="subtask-sheet" aria-label="サブタスク編集">
    <div class="sheet-topbar">
      <div class="sheet-topbar-left">
        <button class="sheet-icon-btn danger" id="btn-sheet-trash" aria-label="削除">
          <svg width="17" height="19" viewBox="0 0 17 19" fill="none">
            <path d="M1 4.5h15M5.5 4.5V3h6v1.5M2.5 4.5l1.1 11h9.8l1.1-11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="sheet-topbar-right">
        <button class="sheet-icon-btn" id="btn-sheet-more" aria-label="その他">
          <svg width="16" height="4" viewBox="0 0 16 4" fill="none">
            <circle cx="2" cy="2" r="1.5" fill="currentColor"/>
            <circle cx="8" cy="2" r="1.5" fill="currentColor"/>
            <circle cx="14" cy="2" r="1.5" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="sheet-input-row">
      <button class="sheet-check-circle" id="sheet-check-circle" aria-label="完了切替"></button>
      <input type="text" id="sheet-subtask-input" placeholder="サブタスク名" maxlength="200" autocomplete="off">
    </div>

    <div class="sheet-colors">
      <button class="sheet-color-dot none" data-color="" aria-label="色なし"></button>
      <button class="sheet-color-dot" style="background:#FF6B6B" data-color="red" aria-label="赤"></button>
      <button class="sheet-color-dot" style="background:#FF9F43" data-color="orange" aria-label="オレンジ"></button>
      <button class="sheet-color-dot" style="background:#FECA57" data-color="yellow" aria-label="黄"></button>
      <button class="sheet-color-dot" style="background:#48DBFB" data-color="cyan" aria-label="水色"></button>
      <button class="sheet-color-dot" style="background:#A29BFE" data-color="purple" aria-label="紫"></button>
      <button class="sheet-color-dot" style="background:#C8C8CC" data-color="gray" aria-label="グレー"></button>
    </div>

    <div class="sheet-date-row">
      <button class="sheet-date-btn" id="btn-sheet-date">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <rect x="1" y="2.5" width="12" height="10.5" rx="2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M1 6h12" stroke="currentColor" stroke-width="1.4"/>
          <path d="M4 1v3M10 1v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        期限・通知
      </button>
      <button class="sheet-date-btn" id="btn-sheet-today">今日</button>
      <button class="sheet-date-btn" id="btn-sheet-tomorrow">明日</button>
    </div>

    <div class="sheet-bottom">
      <div class="sheet-tool-row">
        <button class="sheet-icon-btn" aria-label="メモ">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
            <rect x="1" y="1" width="15" height="15" rx="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4 5.5h9M4 8.5h6M4 11.5h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="sheet-icon-btn" aria-label="画像">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
            <rect x="1" y="1" width="15" height="15" rx="3" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="5.5" cy="5.5" r="1.5" stroke="currentColor" stroke-width="1.3"/>
            <path d="M1 12l4-4 3 3 2-2 4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="sheet-icon-btn" aria-label="インデント">
          <svg width="17" height="14" viewBox="0 0 17 14" fill="none">
            <path d="M1 1h15M6 5h10M6 9h10M1 13h15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M1 5l3 2-3 2V5z" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <button class="btn-sheet-close" id="btn-sheet-close">閉じる</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
